<script>
  // Interior pages: add a "~/page" path label above the Quarto title.
  // Case studies read "~/work/<project>" and keep "Work" highlighted in the nav.
  (function () {
    var title = document.querySelector("#title-block-header h1.title");
    if (!title) return;
    var parts = location.pathname.replace(/\/index\.html$|\/$/, "").split("/").filter(Boolean);
    var page = (parts.length ? parts.join("/") : "index").replace(/\.html$/, "");
    var p = document.createElement("p");
    p.className = "eyebrow path";
    p.textContent = page;
    title.parentNode.insertBefore(p, title);

    if (parts[0] === "work" && parts.length > 1) {
      var work = document.querySelector('.navbar-nav a.nav-link[href$="work.html"]');
      if (work) work.classList.add("active");
    }
  })();

  // Case-study embeds: load the live site only when asked (keeps pages fast).
  // Small screens open it in a new tab instead of a cramped iframe.
  (function () {
    document.querySelectorAll(".project-embed-frame").forEach(function (frame) {
      var button = frame.querySelector(".project-embed-launch");
      if (!button) return;
      button.addEventListener("click", function () {
        var src = frame.getAttribute("data-src");
        if (window.matchMedia("(max-width: 700px)").matches) {
          window.open(src, "_blank", "noopener");
          return;
        }
        var iframe = document.createElement("iframe");
        iframe.src = src;
        iframe.title = frame.getAttribute("data-title") || "Live project";
        iframe.loading = "eager";
        frame.innerHTML = "";
        frame.appendChild(iframe);
      });
    });
  })();

  // Fade content in as it scrolls into view. Only arms when JS runs and motion is allowed,
  // so the page is fully visible without it.
  (function () {
    if (!("IntersectionObserver" in window)) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var targets = document.querySelectorAll(
      ".section-head, .ruled, .work-card, .steps > *, .service-row, .plan, .viz-card, .compare, .terminal, .cta-panel, .about-grid, .quote, .facts, .contact-grid > *, .project-shots > *, .project-embed"
    );
    document.documentElement.classList.add("js-reveal");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("is-visible"); io.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    targets.forEach(function (el, i) {
      el.classList.add("reveal");
      el.style.transitionDelay = (i % 4) * 60 + "ms";
      io.observe(el);
    });
  })();
</script>
